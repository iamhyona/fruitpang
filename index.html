 if(state==='play'||state==='over'){const kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);if(kx&&state==='play')aimX=Math.max(0,Math.min(W,aimX+kx*220*dt));
  if(state==='play'){tGame+=dt;dropT=Math.max(0,dropT-dt);if(MODE==='time'&&Math.floor(tGame*10)!==hud.t){hud.t=Math.floor(tGame*10);hud()}}
  acc+=dt;let n=0;while(acc>=1/60&&n<4){Engine.update(engine,1000/60);doMerges();acc-=1/60;n++}if(n>=4)acc=0;
  if(state==='play')checkOver(dt)}
 shake=Math.max(0,shake-dt);bgmTick();draw(dt)}catch(err){try{console.error(err)}catch(e){}}requestAnimationFrame(loop)}

/* ===== HUD · 화면 ===== */
const PIX={pause:['........','.11..11.','.11..11.','.11..11.','.11..11.','.11..11.','.11..11.','........'],note:['....111.','....1111','....1..1','....1...','....1...','.1111...','11111...','.111....'],trophy:['.111111.','11111111','1.1111.1','.111111.','..1111..','...11...','..1111..','.111111.']};
function pixIcon(k){const m=PIX[k];let r='';m.forEach((row,y)=>[...row].forEach((v,xx)=>{if(v==='1')r+=`<rect x="${xx}" y="${y}" width="1.02" height="1.02"/>`}));return `<i class="pix"><svg viewBox="0 0 ${m[0].length} ${m.length}" shape-rendering="crispEdges" fill="currentColor">${r}</svg></i>`}
document.querySelectorAll('[data-ic]').forEach(el=>{el.outerHTML=pixIcon(el.dataset.ic).replace('<i class="pix"','<i class="pix" data-ic="'+el.dataset.ic+'"')});
function hud(){const T=MODE==='time'&&state!=='title';$('hL').textContent=T?'TIME':'SCORE';$('hScore').textContent=T?fmtT(state==='over'&&clearT?clearT:tGame):score.toLocaleString();const s=$('hScore'),p=s.parentElement;let f=22;s.style.setProperty('font-size',f+'px','important');while(s.scrollWidth>p.clientWidth-12&&f>12){f--;s.style.setProperty('font-size',f+'px','important')}}
function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}
(function(){const sh=$('show');[0,2,4,6,8,9].forEach(k=>{const im=document.createElement('img');im.src=IMG[''+k].toDataURL();im.style.cssText='width:'+(k===9?52:k===8?42:34)+'px;height:auto;margin:0 -4px';im.alt='';sh.appendChild(im)})})();
function togglePause(){if(state==='play'){state='pause';bgmStop();show('ovPause')}else if(state==='pause'){state='play';hide('ovPause');bgmStart();lastT=0}}
$('bPause').onclick=togglePause;$('bResume').onclick=togglePause;
$('bRestart').onclick=()=>{hide('ovPause');startGame(MODE)};
function toMenu(){$('bNext').hidden=true;['ovPause','ovOver','ovRank'].forEach(hide);$('field').classList.remove('dead');state='title';bgmStop();if(engine){Composite.clear(engine.world,false);bodies=[]}FX=[];show('ovTitle');hud()}
$('bMenu').onclick=toMenu;$('bMenu2').onclick=toMenu;
/* 설정 창: 톱니 → 게임 멈추고 열기, 닫으면 이어서 */
if(window.phSettings)phSettings.config({guide:{label:'조준선 · EASY',get:()=>GUIDE,set:v=>{GUIDE=!!v;PP.set('guide',GUIDE)}},fx:{get:()=>FXON,set:v=>{FXON=!!v;PP.set('fx',FXON);if(!FXON){shake=0;FX=FX.filter(f=>f.txt)}}},hap:{get:()=>HAP,set:v=>{HAP=!!v;PP.set('hap',HAP)}}});
let setPaused=false;
$('bSet').onclick=()=>{if(!window.phSettings)return;if(state==='play'){state='pause';setPaused=true;bgmStop()}
 phSettings.open({inGame:state!=='title',restart:()=>{setPaused=false;hide('ovPause');startGame(MODE)},home:()=>{setPaused=false;toMenu()},onClose:()=>{if(setPaused&&state==='pause'){state='play';bgmStart();lastT=0}setPaused=false}})};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
const TUT={"goal":"같은 팡팡이 둘이 닿으면 합쳐져서 커져요!<br>빨강 → … → 하트 → 마지막은 오로라 볼!<br>EASY 하트 · NORMAL 오로라 · HARD 별까지!<br>TIME ATTACK: 마지막 구슬을 최대한 빨리<br>SCORE: 점수 + 하트·오로라·별 보너스<br>맨 위까지 가득 차면 게임 끝!","touch":[["좌우로 끌기","위치 고르기"],["손 떼기","떨어뜨리기"]],"pc":[["마우스 / ← →","떨어뜨릴 곳 고르기"],["클릭 / SPACE","떨어뜨리기"]]};
/* 모드 고르기: 위 슬라이드 토글(TIME ATTACK · SCORE, 기본 SCORE) → 아래 난이도 버튼을 누르면 시작 */
let PICKM='score';function mSync(){$('bModeT').classList.toggle('on',PICKM==='time');$('bModeS').classList.toggle('on',PICKM==='score')}
function lvSync(){document.querySelectorAll('#ovMode .phDiff').forEach(b=>b.classList.toggle('sel',b.dataset.l===LV))}
$('bStart').onclick=()=>{unlock();PICKM='score';mSync();lvSync();show('ovMode');window.phSeg&&phSeg()};
const goMode=m=>{unlock();hide('ovMode');phTut('fruit-tut',TUT,()=>startGame(m))};
$('bModeT').onclick=()=>{PICKM='time';PP.set('mode',PICKM);mSync()};$('bModeS').onclick=()=>{PICKM='score';PP.set('mode',PICKM);mSync()};
document.querySelectorAll('#ovMode .phDiff').forEach(b=>b.onclick=()=>{LV=b.dataset.l;try{localStorage.setItem('fruit-lv',LV)}catch(e){}PP.set('lv',LV);PP.set('mode',PICKM);lvSync();goMode(PICKM)});
$('bRetry').onclick=()=>{hide('ovOver');startGame(MODE)};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));

/* ===== 랭킹 ===== */
const ICO=(()=>{const c={};return k=>c[k]||(c[k]=IMG[''+k].toDataURL())})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function local(){try{return JSON.parse(localStorage.getItem('fruit-ranks')||'[]')}catch(e){return[]}}
$('bSave').onclick=async()=>{if(!lastWin||lastWin.saved)return;const n=($('nameIn').value.trim()||'익명').slice(0,8);localStorage.setItem('fruit-name',n);lastWin.saved=true;lastWin.n=n;$('bSave').textContent='…';$('bSave').disabled=true;
 const rec={n,s:lastWin.score,v:lastWin.stage,m:lastWin.mode};const l=local();l.push(rec);localStorage.setItem('fruit-ranks',JSON.stringify(l.slice(-300)));
 try{await fetch(`${RANK_URL}?g=fruit&a=add&n=${encodeURIComponent(n)}&s=${rec.s}&v=${rec.v}&m=${rec.m}`)}catch(e){}$('bSave').textContent='✓';openRank()};
let RT='score',RL='n',RROWS=null;
function rtSync(){$('rtT').classList.toggle('on',RT==='time');$('rtS').classList.toggle('on',RT==='score');$('rtL').hidden=RT!=='time';$('rtL').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.rl===RL))}
$('rtL').onclick=e=>{const b=e.target.closest('button[data-rl]');if(!b)return;RL=b.dataset.rl;rtSync();if(RROWS)render(RROWS)};
$('rtT').onclick=()=>{RT='time';rtSync();if(RROWS)render(RROWS)};$('rtS').onclick=()=>{RT='score';rtSync();if(RROWS)render(RROWS)};
async function openRank(){RT=lastWin&&lastWin.mode.indexOf('time')===0?'time':state==='title'?RT:MODE;RL=lastWin&&lastWin.lv?lastWin.lv:LV;rtSync();show('ovRank');render(null,true);try{const j=await fetch(`${RANK_URL}?g=fruit`).then(r=>r.json());RROWS=j.top||[]}catch(e){RROWS=local()}render(RROWS)}
const LVOF=m=>(/-(e|h)$/.exec(m||'')||[,'n'])[1]; /* 기존 기록 = NORMAL */
function render(rows,loading){if(loading){$('rankList').innerHTML='<span class="em">LOADING…</span>';return}const T=RT==='time';rows=rows.filter(r=>T?/^time/.test(r.m)&&LVOF(r.m)===RL:/^(score|normal)/.test(r.m)).filter(r=>+r.s>0).sort((a,b)=>T?a.s-b.s:b.s-a.s).slice(0,100);const mw=lastWin&&lastWin.saved?lastWin:null;let marked=false;
 $('rankList').innerHTML=rows.length?rows.map((r,i)=>{let cls='';if(mw&&!marked&&r.n===mw.n&&+r.s===mw.score){cls='me';marked=true}const tier=Math.max(1,Math.min(11,+r.v||1));
  return `<div class="${cls}"><span class="r">${i+1}</span><span><em class="nm">${esc(r.n)}</em>${window.phLv?phLv(({e:'EASY',n:'NORMAL',h:'HARD'})[LVOF(r.m)]):''}</span><span class="s">${T?fmtT(r.s/100):(+r.s).toLocaleString()}</span><span class="m"><img src="${ICO(tier-1)}" style="width:18px;height:18px;vertical-align:middle" alt=""></span></div>`}).join(''):'<span class="em">아직 기록이 없어요</span>'}
$('bRank2').onclick=openRank;$('bRank3').onclick=openRank;

if(location.hash==='#test')window.__t={get state(){return state},get bodies(){return bodies},get score(){return score},get maxTier(){return maxTier},IMG,TR,startGame,drop,gameOver,setX:v=>aimX=v,addPiece:(k,px,py)=>addPiece(k,px,py,0)};
resize();hud();requestAnimationFrame(loop);
})();
</script>
</body>
