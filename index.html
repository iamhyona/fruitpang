function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}
(function(){const sh=$('show');[0,3,5,7,10].forEach(k=>{const im=document.createElement('img');im.src=IMG[''+k].toDataURL();im.style.cssText='width:'+(k===10?52:36)+'px;height:auto;margin:0 -4px';im.alt='';sh.appendChild(im)})})();
function togglePause(){if(state==='play'){state='pause';bgmStop();show('ovPause')}else if(state==='pause'){state='play';hide('ovPause');bgmStart();lastT=0}}
$('bPause').onclick=togglePause;$('bResume').onclick=togglePause;
$('bRestart').onclick=()=>{hide('ovPause');startGame()};
function toMenu(){['ovPause','ovOver','ovRank'].forEach(hide);$('field').classList.remove('dead');state='title';bgmStop();if(engine){Composite.clear(engine.world,false);bodies=[]}FX=[];show('ovTitle');hud()}
$('bMenu').onclick=toMenu;$('bMenu2').onclick=toMenu;
$('bSound').onclick=()=>{sound=!sound;$('bSound').classList.toggle('on',sound);if(ac&&master)master.gain.value=sound?1:0;if(sound&&state==='play')bgmStart()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
const TUT={"goal":"같은 과일 팡팡이 둘이 닿으면 합쳐져서 커져요!<br>체리부터 시작해서 끝까지 키우면 수박!<br>점선 위로 넘치면 게임 끝!","touch":[["← 밀기 →","떨어뜨릴 곳 고르기"],["손 떼기","떨어뜨리기"]],"pc":[["마우스 / ← →","떨어뜨릴 곳 고르기"],["클릭 / SPACE","떨어뜨리기"]]};
$('bStart').onclick=()=>{unlock();phTut('fruit-tut',TUT,startGame)};
$('bRetry').onclick=()=>{hide('ovOver');startGame()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));

/* ===== 랭킹 ===== */
const ICO=(()=>{const c={};return k=>c[k]||(c[k]=IMG[''+k].toDataURL())})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function local(){try{return JSON.parse(localStorage.getItem('fruit-ranks')||'[]')}catch(e){return[]}}
$('bSave').onclick=async()=>{if(!lastWin||lastWin.saved)return;const n=($('nameIn').value.trim()||'익명').slice(0,8);localStorage.setItem('fruit-name',n);lastWin.saved=true;lastWin.n=n;$('bSave').textContent='…';$('bSave').disabled=true;
 const rec={n,s:lastWin.score,v:lastWin.stage,m:lastWin.mode};const l=local();l.push(rec);localStorage.setItem('fruit-ranks',JSON.stringify(l.slice(-300)));
 try{await fetch(`${RANK_URL}?g=fruit&a=add&n=${encodeURIComponent(n)}&s=${rec.s}&v=${rec.v}&m=${rec.m}`)}catch(e){}$('bSave').textContent='✓';openRank()};
async function openRank(){show('ovRank');render(null,true);try{const j=await fetch(`${RANK_URL}?g=fruit`).then(r=>r.json());render(j.top||[])}catch(e){render(local())}}
function render(rows,loading){if(loading){$('rankList').innerHTML='<span class="em">LOADING…</span>';return}rows=rows.slice().sort((a,b)=>b.s-a.s);const mw=lastWin&&lastWin.saved?lastWin:null;let marked=false;
 $('rankList').innerHTML=rows.length?rows.map((r,i)=>{let cls='';if(mw&&!marked&&r.n===mw.n&&+r.s===mw.score){cls='me';marked=true}const tier=Math.max(1,Math.min(11,+r.v||1));
  return `<div class="${cls}"><span class="r">${i+1}</span><span>${esc(r.n)}</span><span class="s">${r.s}</span><span class="m"><img src="${ICO(tier-1)}" style="width:18px;height:18px;vertical-align:middle" alt=""></span></div>`}).join(''):'<span class="em">아직 기록이 없어요</span>'}
$('bRank').onclick=()=>{if(state==='play')togglePause();openRank()};$('bRank2').onclick=openRank;$('bRank3').onclick=openRank;

if(location.hash==='#test')window.__t={get state(){return state},get bodies(){return bodies},get score(){return score},get maxTier(){return maxTier},startGame,drop,setX:v=>aimX=v,addPiece:(k,px,py)=>addPiece(k,px,py,0)};
resize();hud();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
